name: Android Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      # لا يوجد gradlew في المستودع بعد؛ نستخدم Gradle 8.9 مباشرة.
      # (بعد تشغيل `gradle wrapper` وإضافة gradlew يمكن حذف gradle-version.)
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # توقف صريح إن لم تتوفر بيانات التوقيع — لا يُنشأ مفتاح بديل أبدًا.
      - name: Require signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=0
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::السر المفقود: $v"; missing=1; fi
          done
          [ "$missing" -eq 0 ] || { echo "::error::أضف الأسرار في Settings > Secrets. لن يُنشأ مفتاح بديل."; exit 1; }

      - name: Restore keystore (outside the repo)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # قبل البناء: التحقق من أن المفتاح المخزَّن هو المفتاح الأصلي.
      - name: Verify keystore fingerprints
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: bash scripts/verify-signing.sh keystore "$KEYSTORE_PATH"

      - name: Check Firebase config
        run: python3 scripts/check-firebase.py

      - name: Build signed APK and AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease bundleRelease --no-daemon

      # بعد البناء: التحقق من التوقيع الفعلي للمخرجات.
      - name: Verify built APK
        run: bash scripts/verify-signing.sh apk "$(ls app/build/outputs/apk/release/*.apk | head -n1)"

      - name: Verify built AAB
        run: bash scripts/verify-signing.sh aab "$(ls app/build/outputs/bundle/release/*.aab | head -n1)"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: khuyut-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab

      # لا يُنشر Release إلا بعد نجاح كل خطوات التحقق أعلاه.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
