name: Android Debug Build

# بناء تجريبي للتطوير فقط. لا يحتاج أي أسرار، ولا يصلح للنشر.
# يُوقَّع بمفتاح debug الافتراضي لأندرويد (وليس مفتاح النشر الأصلي).
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: khuyut-debug-apk-NOT-FOR-RELEASE
          path: app/build/outputs/apk/debug/*.apk
